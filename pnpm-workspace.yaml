packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default; allow only the ones we need.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

ignoredBuiltDependencies:
  - msgpackr-extract
