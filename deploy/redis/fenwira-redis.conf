# Fenwira overrides for Ubuntu's redis-server (apt). Append to /etc/redis/redis.conf with
#   include /etc/redis/fenwira-redis.conf
# Same semantics as the Compose service (redis-server --appendonly yes --maxmemory-policy noeviction).

# Loopback only: Redis is never reachable from outside the instance.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# BullMQ keeps jobs, locks, schedulers and rate limits in Redis. Eviction would silently drop them,
# so Redis must refuse writes when full instead (BullMQ requirement).
maxmemory-policy noeviction
# Budget on a 4 GB instance (docs/deployment/RESOURCE_BUDGET.md). Alert well before this is reached.
maxmemory 512mb

# Persistence: AOF every second + periodic RDB snapshots. Postgres remains the source of truth
# (AGENTS.md rule 4); Redis persistence protects in-flight jobs and schedules across restarts.
appendonly yes
appendfsync everysec
save 900 1
save 300 100
dir /var/lib/redis

# Optional password (then use redis://:<password>@127.0.0.1:6379/0 in REDIS_URL):
# requirepass <set-in-/etc/redis/fenwira-redis-secret.conf, not here>
