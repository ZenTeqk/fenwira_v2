# Catch-all for host names that aren't Fenwira's: scanners, IP-only requests, stale DNS, forged Host
# headers. Installed as sites-available/fenwira-default.conf by deploy/scripts/render-nginx.sh (no
# placeholders) and at first boot by the Terraform bootstrap; needs no certificate.

# HTTP: close the connection without a response, except ACME HTTP-01 challenges.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 444; }
}

# HTTPS: refuse the TLS handshake for an unknown or missing SNI, so no certificate (and no host name)
# is revealed (nginx >= 1.19.4). A request with a valid SNI but a foreign Host header lands here
# too and is refused with 421 Misdirected Request. `http2` matches the other 443 listeners.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    server_tokens off;
    return 421;
}
