name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRISMA_HIDE_UPDATE_MESSAGE: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint + module boundaries)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Prettier
        run: pnpm format:check

  integration:
    name: Integration tests (Postgres + Redis, as fenwira_app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Run integration suite in the fenwira-test container
        run: docker compose --profile test run --rm --build fenwira-test
      - if: failure()
        run: docker compose --profile test logs --no-color
      - if: always()
        run: docker compose --profile test down -v

  docker:
    name: Docker build, compose smoke test, image scan
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build images
        run: docker compose build
      - name: Start the platform
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test (health + outbox round trip)
        run: bash scripts/smoke.sh
      - name: Scan images (Trivy, fixable HIGH/CRITICAL)
        run: |
          for image in fenwira/api:local fenwira/worker:local fenwira/migrate:local fenwira/web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --no-progress "$image"
          done
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  security:
    name: Secret and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest git /repo --redact --verbose
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Dependency audit (production deps, high+)
        run: pnpm audit --prod --audit-level high
