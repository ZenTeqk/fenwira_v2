version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
      prisma: { patterns: ['prisma', '@prisma/*'] }
      lint: { patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals'] }
      test: { patterns: ['vitest', '@playwright/*', 'supertest', '@types/supertest'] }
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
